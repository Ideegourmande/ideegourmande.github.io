<!DOCTYPE html>
<html lang="fr">

<head>

<title>Administration - Idée Gourmande</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<script>

if(localStorage.getItem("adminConnecte") !== "oui"){

window.location.href="admin-login.html";

}

</script>



<header>

<div class="top-banner">

🔐 Administration des commandes - Idée Gourmande

</div>

Tableau de bord
</h1>



<button

</button>


<a 
href="archives.html"
class="btn">

📂 Voir les archives

</a>



</section>






<section class="stats">


<div class="stat-card">

<h3>
Commandes
</h3>

<strong id="nbCommandes">
0
</strong>

</div>

</strong>

<h2>

<input
type="search"
