</head>


<body>


<script>

    localStorage.getItem("adminConnecte") !== "oui"
){

<!-- =========================

    >

    </a>

<!-- =========================

========================= -->

    <div class="panier-card">


        <h2>

            🛒 Articles à acheter

        </h2>


        <p>

            Cette liste contient uniquement les besoins
            générés automatiquement par les commandes clients.

        </p>


        <table>

            <thead>

                <tr>

                    <th>
                        Article
                    </th>

                    <th>
                        Stock actuel
                    </th>

                    <th>
                        Minimum
                    </th>

                    <th>
                        À acheter
                    </th>

                    <th>
                        Origine
                    </th>

                </tr>

            </thead>


            <tbody id="listeBesoins">

            </tbody>

        </table>

</section>

     PIED DE PAGE
========================= -->

<footer>

    <p>

        © Idée Gourmande - Genève

    </p>

</footer>



<!-- =========================
     BASE DE DONNÉES
========================= -->

<script src="js/database.js"></script>



<script>


// ======================================
// AFFICHAGE LISTE DE COURSES
// ======================================

function afficherBesoins(){


    const zone =
        document.getElementById(
            "listeBesoins"
        );


    if(!zone){

        return;

    }


    zone.innerHTML = "";


    // ==================================
    // SECURITE BASE
    // ==================================

    if(
        typeof db === "undefined" ||
        !db
    ){

        zone.innerHTML = `

            <tr>

                <td colspan="5">

                    ❌ Base de données indisponible

                </td>

            </tr>

        `;

        return;

    }


    // ==================================
    // SECURITE ACHATS
    // ==================================

    if(
        !Array.isArray(db.achats)
    ){

        db.achats = [];

    }


    // ==================================
    // SECURITE ARTICLES
    // ==================================

    if(
        !Array.isArray(db.articles)
    ){

        db.articles = [];

    }


    // ==================================
    // ACHATS AUTOMATIQUES EN ATTENTE
    // ==================================

    const achatsEnAttente =

        db.achats.filter(
            function(achat){

                if(!achat){

                    return false;

                }


                /*
                    Uniquement les achats
                    créés automatiquement.
                */

                if(
                    achat.automatique !== true
                ){

                    return false;

                }


                /*
                    Sécurité supplémentaire :
                    l'origine doit être une
                    commande client.
                */

                if(
                    achat.origine !== "Commande client"
                ){

                    return false;

                }


                /*
                    Achat déjà réceptionné.
                */

                if(
                    achat.statut === "Réceptionné"
                ){

                    return false;

                }


                /*
                    Achat sans lignes.
                */

                if(
                    !Array.isArray(
                        achat.articles
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    // ==================================
    // AUCUN ACHAT
    // ==================================

    if(
        achatsEnAttente.length === 0
    ){

        zone.innerHTML = `

            <tr>

                <td colspan="5">

                    ✅ Aucun besoin d'achat

                </td>

            </tr>

        `;

        return;

    }


    // ==================================
    // REGROUPEMENT DES ARTICLES
    // ==================================

    const besoins = [];


    achatsEnAttente.forEach(
        function(achat){


            achat.articles.forEach(
                function(ligne){


                    if(!ligne){

                        return;

                    }


                    const quantite =
                        Number(
                            ligne.quantite
                        ) || 0;


                    if(
                        quantite <= 0
                    ){

                        return;

                    }


                    const nomArticle =
                        String(
                            ligne.article || ""
                        )
                        .trim();


                    if(
                        nomArticle === ""
                    ){

                        return;

                    }


                    const reference =
                        String(
                            ligne.reference || ""
                        )
                        .trim();


                    /*
                        Recherche d'une ligne
                        déjà présente.
                    */

                    const existant =
                        besoins.find(
                            function(besoin){

                                return (

                                    String(
                                        besoin.article
                                    )
                                    .trim()
                                    .toLowerCase()

                                    ===

                                    nomArticle
                                        .trim()
                                        .toLowerCase()

                                    &&

                                    String(
                                        besoin.reference
                                    )
                                    .trim()
                                    .toLowerCase()

                                    ===

                                    reference
                                        .trim()
                                        .toLowerCase()

                                );

                            }
                        );


                    if(existant){

                        existant.quantite +=
                            quantite;


                        existant.origines.push({

                            numero:
                                achat.numero ||
                                achat.id ||
                                "Achat",

                            quantite:
                                quantite

                        });


                    }
                    else{

                        besoins.push({

                            article:
                                nomArticle,

                            reference:
                                reference,

                            quantite:
                                quantite,

                            origines: [

                                {

                                    numero:
                                        achat.numero ||
                                        achat.id ||
                                        "Achat",

                                    quantite:
                                        quantite

                                }

                            ]

                        });

                    }

                }
            );

        }
    );


    // ==================================
    // AUCUN ARTICLE VALIDE
    // ==================================

    if(
        besoins.length === 0
    ){

        zone.innerHTML = `

            <tr>

                <td colspan="5">

                    ✅ Aucun besoin d'achat

                </td>

            </tr>

        `;

        return;

    }


    // ==================================
    // CONSTRUCTION TABLEAU
    // ==================================

    let html = "";


    besoins.forEach(
        function(besoin){


            // ==================================
            // RECHERCHE ARTICLE STOCK
            // ==================================

            let articleStock = null;


            /*
                On utilise en priorité la fonction
                centrale de database.js.

                Elle gère les références,
                variantes et recettes.
            */

            if(
                typeof trouverArticleStock === "function"
            ){

                articleStock =
                    trouverArticleStock({

                        nom:
                            besoin.article,

                        reference:
                            besoin.reference

                    });

            }


            /*
                Si aucune correspondance n'est
                trouvée, recherche classique
                par nom.
            */

            if(
                !articleStock
            ){

                articleStock =
                    db.articles.find(
                        function(article){

                            if(!article){

                                return false;

                            }


                            return (

                                String(
                                    article.nom || ""
                                )
                                .trim()
                                .toLowerCase()

                                ===

                                besoin.article
                                    .trim()
                                    .toLowerCase()

                            );

                        }
                    )
                    || null;

            }


            // ==================================
            // INFORMATIONS STOCK
            // ==================================

            const stock =

                articleStock

                ?

                (
                    Number(
                        articleStock.stock
                    ) || 0
                )

                :

                0;


            const minimum =

                articleStock

                ?

                (
                    Number(
                        articleStock.minimum
                    ) || 0
                )

                :

                0;


            const unite =

                articleStock

                ?

                String(
                    articleStock.unite || ""
                )

                :

                "";


            // ==================================
            // TEXTE SECURISE
            // ==================================

            const nomAffiche =

                typeof securiserTexte === "function"

                ?

                securiserTexte(
                    besoin.article
                )

                :

                besoin.article;


            const referenceAffiche =

                typeof securiserTexte === "function"

                ?

                securiserTexte(
                    besoin.reference
                )

                :

                besoin.reference;


            const uniteAffiche =

                typeof securiserTexte === "function"

                ?

                securiserTexte(
                    unite
                )

                :

                unite;


            // ==================================
            // ORIGINES
            // ==================================

            const originesHTML =

                besoin.origines
                .map(
                    function(origine){

                        const numero =

                            typeof securiserTexte === "function"

                            ?

                            securiserTexte(
                                String(
                                    origine.numero
                                )
                            )

                            :

                            String(
                                origine.numero
                            );


                        return `

                            <div>

                                🛒 ${numero}

                                <small>

                                    (${origine.quantite}${uniteAffiche})

                                </small>

                            </div>

                        `;

                    }
                )
                .join("");


            // ==================================
            // LIGNE TABLEAU
            // ==================================

            html += `

                <tr>


                    <!-- ARTICLE -->

                    <td>

                        <strong>

                            ${nomAffiche}

                        </strong>


                        ${
                            referenceAffiche

                            ?

                            `

                            <br>

                            <small>

                                Réf. :
                                ${referenceAffiche}

                            </small>

                            `

                            :

                            ""

                        }

                    </td>


                    <!-- STOCK -->

                    <td>

                        ${stock}

                        ${uniteAffiche}

                    </td>


                    <!-- MINIMUM -->

                    <td>

                        ${minimum}

                        ${uniteAffiche}

                    </td>


                    <!-- A ACHETER -->

                    <td>

                        <strong>

                            ${besoin.quantite}

                            ${uniteAffiche}

                        </strong>

                    </td>


                    <!-- ORIGINE -->

                    <td>

                        ${originesHTML}

                    </td>


                </tr>

            `;

        }
    );


    // ==================================
    // AFFICHAGE
    // ==================================

    zone.innerHTML =
        html;

}



// ======================================
// INITIALISATION
// ======================================

document.addEventListener(
    "DOMContentLoaded",
    function(){

        afficherBesoins();

    }
);



// ======================================
// SYNCHRONISATION ENTRE LES PAGES
// ======================================

window.addEventListener(
    "storage",
    function(e){


        if(
            e.key !== "ideeGourmandeDB"
        ){

            return;

        }


        try{


            const nouvelleBase =
                localStorage.getItem(
                    "ideeGourmandeDB"
                );


            if(!nouvelleBase){

                return;

            }


            const baseChargee =
                JSON.parse(
                    nouvelleBase
                );


            if(
                !baseChargee ||
                typeof baseChargee !== "object"
            ){

                return;

            }


            /*
                Mise à jour de la variable
                centrale utilisée par la page.
            */

            db =
                baseChargee;


            afficherBesoins();


        }
        catch(erreur){

            console.error(
                "❌ Impossible de recharger la base :",
                erreur
            );

        }

    }
);


</script>


</body>

</html>
